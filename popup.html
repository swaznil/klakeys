<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Klakeys</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="popup">
    <header class="header">
      <div>
        <h1>Klakeys</h1>
        <p>Keyboard sound and typing pace.</p>
      </div>

      <div class="header-actions">
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >
          <span id="themeIcon" aria-hidden="true">☾</span>
        </button>

        <span
          id="version"
          class="version"
          aria-label="Extension version"
        ></span>
      </div>
    </header>

    <section class="section" aria-labelledby="soundHeading">
      <div class="section-title">
        <h2 id="soundHeading">Sound</h2>
        <span id="statusText" class="state" role="status">On</span>
      </div>

      <label class="option">
        <span>
          <strong>Keyboard sounds</strong>
          <small>Play sounds in text fields</small>
        </span>

        <input
          id="enabledToggle"
          class="check"
          type="checkbox"
          aria-label="Enable keyboard sounds"
        >
      </label>

      <div class="volume">
        <div class="volume-label">
          <label for="volumeSlider">Volume</label>
          <output id="volumeValue" for="volumeSlider">30%</output>
        </div>

        <input
          id="volumeSlider"
          type="range"
          min="0"
          max="100"
          step="1"
          value="30"
          aria-describedby="volumeValue"
        >
      </div>
    </section>

    <section class="section" aria-labelledby="displayHeading">
      <h2 id="displayHeading">Display</h2>

      <label class="option">
        <span>
          <strong>Floating WPM</strong>
          <small>Keep your current pace visible on webpages</small>
        </span>

        <input
          id="overlayToggle"
          class="check"
          type="checkbox"
          aria-label="Always show floating WPM"
        >
      </label>
    </section>

    <section class="section" aria-labelledby="exceptionsHeading">
      <h2 id="exceptionsHeading">Site exceptions</h2>

      <label class="exceptions-label" for="excludedSites">
        Disable Klakeys on these sites
      </label>

      <textarea
        id="excludedSites"
        rows="4"
        placeholder="example.com&#10;docs.google.com"
        spellcheck="false"
      ></textarea>

      <small class="help-text">
        Add one domain per line. Subdomains are included.
      </small>

      <button
        id="saveExceptionsButton"
        class="text-button"
        type="button"
      >
        Save sites
      </button>
    </section>

    <section
      class="section stats-section"
      aria-labelledby="statsHeading"
    >
      <div class="section-title">
        <div>
          <h2 id="statsHeading">Today</h2>
          <span id="statsDate" class="date"></span>
        </div>

        <button
          id="resetStatsButton"
          class="text-button"
          type="button"
        >
          Reset
        </button>
      </div>

      <div class="stats">
        <div class="stat">
          <span id="wpmValue" class="stat-value">0</span>
          <span class="stat-label">WPM</span>
        </div>

        <div class="stat">
          <span id="wordValue" class="stat-value">0</span>
          <span class="stat-label">Words typed</span>
        </div>
      </div>
    </section>

    <p
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>

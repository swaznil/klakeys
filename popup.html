<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Klakeys</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="popup">
    <header>
      <div>
        <h1>Klakeys</h1>
        <p>Mechanical sounds while you type.</p>
      </div>

      <span id="version" class="version" aria-label="Extension version"></span>
    </header>

    <section class="setting">
      <div>
        <strong>Keyboard sounds</strong>
        <span id="statusText" role="status">Enabled</span>
      </div>

      <label class="switch">
        <input
          id="enabledToggle"
          type="checkbox"
          aria-label="Enable keyboard sounds"
        >
        <span class="slider"></span>
      </label>
    </section>

    <section class="volume-section">
      <div class="section-heading">
        <label for="volumeSlider">Volume</label>
        <span id="volumeValue">30%</span>
      </div>

      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        step="1"
        value="30"
        aria-describedby="volumeValue"
      >
    </section>

    <section class="stats-section">
      <div class="section-heading">
        <div>
          <strong>Today</strong>
          <span id="statsDate"></span>
        </div>

        <button id="resetStatsButton" type="button" title="Reset today's stats">
          Reset
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <span class="stat-value" id="wpmValue">0</span>
          <span class="stat-label">WPM</span>
        </div>

        <div class="stat">
          <span class="stat-value" id="keystrokeValue">0</span>
          <span class="stat-label">Keys</span>
        </div>

        <div class="stat">
          <span class="stat-value" id="wordValue">0</span>
          <span class="stat-label">Words</span>
        </div>
      </div>
    </section>

    <footer>
      <span>Sounds only work inside webpages.</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
